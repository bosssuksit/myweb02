        <tr>
            <td>a</td>
            <td>b</td>
            <td>c</td>
            <td>d</td>
        </tr>
        <tr>
            <td>e</td>
            <td>f</td>
            <td>g</td>
            <td>h</td>
        </tr>
        <tr>
            <td>i</td>
            <td>g</td>
            <td>k</td>
            <td>l</td>
        </tr>

    </table>


     <!-- ตารางแบบที่ทุกแถวมีจำนวนคอลัมน์ไม่เท่ากัน -->
    <<tabl border="1" width="400">

    </table>


</body>
</html>
